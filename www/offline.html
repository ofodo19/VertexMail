<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vertex Mail</title>
<style>
  :root { color-scheme: light dark; --bg:#F7F8FB; --fg:#080B18; --muted:#4A5164; --btn:#2952E3; }
  @media (prefers-color-scheme: dark) { :root { --bg:#10152A; --fg:#F7F8FC; --muted:#A7AEC3; --btn:#4A6CF7; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center;
         background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .card { max-width: 340px; }
  .icon { width: 72px; height: 72px; margin: 0 auto 20px; border-radius: 20px; background: var(--btn);
          display: flex; align-items: center; justify-content: center; }
  .icon svg { width: 38px; height: 38px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { margin: 0 0 24px; color: var(--muted); font-size: 15px; line-height: 1.5; }
  button { appearance: none; border: 0; border-radius: 12px; background: var(--btn); color: #fff;
           font-size: 16px; font-weight: 600; padding: 13px 28px; width: 100%; }
  button:active { opacity: .85; }
  .hint { margin-top: 14px; font-size: 13px; color: var(--muted); min-height: 18px; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 8.5a15 15 0 0 1 20 0"/><path d="M5.5 12a10 10 0 0 1 13 0"/><path d="M9 15.5a5 5 0 0 1 6 0"/><circle cx="12" cy="19" r="1" fill="#fff"/>
        <path d="M3 3l18 18"/>
      </svg>
    </div>
    <h1>Can't connect</h1>
    <p>Check your internet connection and try again.</p>
    <button id="retry" type="button">Try again</button>
    <div class="hint" id="hint"></div>
  </div>
<script>
  // Retry always goes back to the app's own start page — no address is ever shown to the user.
  function go() { window.location.replace('/inbox'); }
  function check(manual) {
    var hint = document.getElementById('hint');
    if (manual) hint.textContent = 'Checking…';
    fetch('/inbox', { method: 'HEAD', cache: 'no-store' })
      .then(function (r) { if (r.status < 500) go(); else if (manual) hint.textContent = 'Still not available. Please try again shortly.'; })
      .catch(function () { if (manual) hint.textContent = 'Still no connection.'; });
  }
  document.getElementById('retry').addEventListener('click', function () { check(true); });
  window.addEventListener('online', function () { check(false); });
  setInterval(function () { check(false); }, 5000);
</script>
</body>
</html>
